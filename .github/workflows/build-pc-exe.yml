name: Build Windows PC GUI EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc_agent/**'
      - '.github/workflows/build-pc-exe.yml'

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and build OmniLivePCAgent.exe (GUI)
        working-directory: pc_agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller --noconfirm --clean --onefile --windowed --name OmniLivePCAgent omnilive_pc_agent.py

      - name: Upload OmniLivePCAgent.exe (GUI) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniLivePCAgent-GUI-Windows-exe
          path: pc_agent/dist/OmniLivePCAgent.exe
